# The box is a 7.5 GB one and the whole system (ssh tunnel included) must keep
# breathing through a build: the daemon and the Kotlin compiler between them
# stay under ~4.5 GB of heap, and the worker count keeps the forked JVMs few.
org.gradle.jvmargs=-Xmx2560M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536M
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

chumpyPackageName=slop.miho.chumpy

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
